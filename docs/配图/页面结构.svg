<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="752" viewBox="0 0 1440 752" role="img" aria-labelledby="title desc"><title id="title">单页结构：连续页码、可上图文字、简短画面说明</title><desc id="desc">故事漫画脚本的中文使用图解。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245c4b" stroke-width="1.5"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="1" y="1" width="1438" height="750" rx="24" fill="#f7f5ee" stroke="#f7f5ee"/><text x="64" y="65" font-size="34" fill="#193d35" font-weight="700">一页脚本，怎样交给绘图流程</text><text x="64" y="105" font-size="22" fill="#697770" font-weight="400">上图文字与画面说明，各自承担明确的工作。</text><rect x="64" y="145" width="700" height="552" rx="18" fill="white" stroke="#dce2d9"/><text x="102" y="197" font-size="29" fill="#193d35" font-weight="700">第03页</text><rect x="102" y="224" width="136" height="38" rx="8" fill="#e9f0e7" stroke="#e9f0e7"/><text x="118" y="251" font-size="23" fill="#245c4b" font-weight="650">上图文字</text><text x="102" y="309" font-size="27" fill="#193d35" font-weight="400">猫刚蜷好，他就伸手</text><text x="102" y="352" font-size="27" fill="#193d35" font-weight="400">摸了摸它的脑袋。</text><text x="102" y="395" font-size="27" fill="#193d35" font-weight="400">爸爸：「它叫什么来着？」</text><line x1="102" y1="430" x2="726" y2="430" stroke="#dce2d9"/><rect x="102" y="459" width="136" height="38" rx="8" fill="#f4e9d9" stroke="#f4e9d9"/><text x="118" y="486" font-size="23" fill="#b57232" font-weight="650">画面说明</text><text x="102" y="544" font-size="24" fill="#193d35" font-weight="400">橘白猫蜷在木椅上，爸爸坐在旁边，</text><text x="102" y="584" font-size="24" fill="#193d35" font-weight="400">轻轻摸着猫的头；我在一旁看着。</text><text x="102" y="653" font-size="21" fill="#697770" font-weight="400">一个场景 · 一个主要时刻 · 人物和物件连续</text><text x="830" y="175" font-size="25" fill="#245c4b" font-weight="700">01  页码</text><text x="830" y="213" font-size="25" fill="#193d35" font-weight="600">控制连续翻阅顺序</text><text x="830" y="252" font-size="21" fill="#697770" font-weight="400">第 01 页到第 N 页连续编号。</text><text x="830" y="323" font-size="25" fill="#245c4b" font-weight="700">02  上图文字</text><text x="830" y="361" font-size="25" fill="#193d35" font-weight="600">读者在漫画里看到的成稿</text><text x="830" y="400" font-size="21" fill="#697770" font-weight="400">旁白、对白、心理文字按语意换行。</text><text x="830" y="432" font-size="21" fill="#697770" font-weight="400">默认约 25—60 个可见字符。</text><text x="830" y="518" font-size="25" fill="#b57232" font-weight="700">03  画面说明</text><text x="830" y="556" font-size="25" fill="#193d35" font-weight="600">绘制这一页时使用的说明</text><text x="830" y="595" font-size="21" fill="#697770" font-weight="400">1—2 句交代人物、场景和主要动作。</text><text x="830" y="627" font-size="21" fill="#697770" font-weight="400">关键换场、跳时与道具状态写清楚。</text></g></svg>