<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="450" viewBox="0 0 1440 450" role="img" aria-labelledby="title desc"><title id="title">创作流程：提供素材、抓住变化、展开过程、按内容分页、交付成稿</title><desc id="desc">故事漫画脚本的中文使用图解。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245c4b" stroke-width="1.5"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="1" y="1" width="1438" height="448" rx="24" fill="#f7f5ee" stroke="#f7f5ee"/><text x="54" y="64" font-size="34" fill="#193d35" font-weight="700">从一句话，到逐页成稿</text><text x="54" y="103" font-size="22" fill="#697770" font-weight="400">给出故事素材，剩下的按内容展开。</text><rect x="54" y="145" width="250" height="202" rx="18" fill="white" stroke="#dce2d9"/><rect x="74" y="165" width="48" height="35" rx="9" fill="#eaf0e8" stroke="#eaf0e8"/><text x="82" y="190" font-size="22" fill="#245c4b" font-weight="700">01</text><text x="74" y="237" font-size="28" fill="#193d35" font-weight="650">提供素材</text><text x="74" y="278" font-size="21" fill="#697770" font-weight="400">一句话、经历</text><text x="74" y="310" font-size="21" fill="#697770" font-weight="400">提纲或已有长稿</text><path d="M307 246 H319" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="324" y="145" width="250" height="202" rx="18" fill="white" stroke="#dce2d9"/><rect x="344" y="165" width="48" height="35" rx="9" fill="#eaf0e8" stroke="#eaf0e8"/><text x="352" y="190" font-size="22" fill="#245c4b" font-weight="700">02</text><text x="344" y="237" font-size="28" fill="#193d35" font-weight="650">抓住变化</text><text x="344" y="278" font-size="21" fill="#697770" font-weight="400">原先怎样看</text><text x="344" y="310" font-size="21" fill="#697770" font-weight="400">后来怎样行动或理解</text><path d="M577 246 H589" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="594" y="145" width="250" height="202" rx="18" fill="white" stroke="#dce2d9"/><rect x="614" y="165" width="48" height="35" rx="9" fill="#eaf0e8" stroke="#eaf0e8"/><text x="622" y="190" font-size="22" fill="#245c4b" font-weight="700">03</text><text x="614" y="237" font-size="28" fill="#193d35" font-weight="650">展开过程</text><text x="614" y="278" font-size="21" fill="#697770" font-weight="400">事件、回应、选择</text><text x="614" y="310" font-size="21" fill="#697770" font-weight="400">让结果有来处</text><path d="M847 246 H859" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="864" y="145" width="250" height="202" rx="18" fill="white" stroke="#dce2d9"/><rect x="884" y="165" width="48" height="35" rx="9" fill="#eaf0e8" stroke="#eaf0e8"/><text x="892" y="190" font-size="22" fill="#245c4b" font-weight="700">04</text><text x="884" y="237" font-size="28" fill="#193d35" font-weight="650">按内容分页</text><text x="884" y="278" font-size="21" fill="#697770" font-weight="400">一页一个主要画面</text><text x="884" y="310" font-size="21" fill="#697770" font-weight="400">默认最多 18 页</text><path d="M1117 246 H1129" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1134" y="145" width="250" height="202" rx="18" fill="white" stroke="#dce2d9"/><rect x="1154" y="165" width="48" height="35" rx="9" fill="#eaf0e8" stroke="#eaf0e8"/><text x="1162" y="190" font-size="22" fill="#245c4b" font-weight="700">05</text><text x="1154" y="237" font-size="28" fill="#193d35" font-weight="650">交付成稿</text><text x="1154" y="278" font-size="21" fill="#697770" font-weight="400">标题＋逐页上图文字</text><text x="1154" y="310" font-size="21" fill="#697770" font-weight="400">＋简短画面说明</text><text x="54" y="403" font-size="23" fill="#245c4b" font-weight="500">交付之后：接入自己的绘图流程，补充画风、人物设定与图片排版。</text></g></svg>