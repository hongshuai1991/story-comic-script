<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc"><title id="title">两种叙事节奏：一个事件改变判断、当下小事牵出回忆</title><desc id="desc">故事漫画脚本的中文使用图解。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245c4b" stroke-width="1.5"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="1" y="1" width="1438" height="698" rx="24" fill="#f7f5ee" stroke="#f7f5ee"/><text x="64" y="65" font-size="34" fill="#193d35" font-weight="700">让故事自然往下走的两种节奏</text><text x="64" y="105" font-size="22" fill="#697770" font-weight="400">节点按内容分配页数，同一个场景也可以跨越数页。</text><text x="64" y="156" font-size="27" fill="#245c4b" font-weight="700">A  一个事件，逐步改变判断</text><rect x="64" y="184" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="84" y="231" font-size="26" fill="#193d35" font-weight="650">进入情境</text><text x="84" y="272" font-size="20" fill="#697770" font-weight="400">我原先怎样看</text><path d="M300 244 H317" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="328" y="184" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="348" y="231" font-size="26" fill="#193d35" font-weight="650">事情发生</text><text x="348" y="272" font-size="20" fill="#697770" font-weight="400">发生了什么</text><path d="M564 244 H581" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="592" y="184" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="612" y="231" font-size="26" fill="#193d35" font-weight="650">尝试回应</text><text x="612" y="272" font-size="20" fill="#697770" font-weight="400">我怎样应对</text><path d="M828 244 H845" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="856" y="184" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="876" y="231" font-size="26" fill="#193d35" font-weight="650">关键行为</text><text x="876" y="272" font-size="20" fill="#697770" font-weight="400">行动带来后果</text><path d="M1092 244 H1109" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1120" y="184" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="1140" y="231" font-size="26" fill="#193d35" font-weight="650">选择与结果</text><text x="1140" y="272" font-size="20" fill="#697770" font-weight="400">关系或理解变化</text><text x="64" y="390" font-size="27" fill="#245c4b" font-weight="700">B  当下小事，牵出一段回忆</text><rect x="64" y="418" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="84" y="465" font-size="26" fill="#193d35" font-weight="650">当下触发</text><text x="84" y="506" font-size="20" fill="#697770" font-weight="400">一个动作或物件</text><path d="M300 478 H317" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="328" y="418" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="348" y="465" font-size="26" fill="#193d35" font-weight="650">相关往事</text><text x="348" y="506" font-size="20" fill="#697770" font-weight="400">建立关系的细节</text><path d="M564 478 H581" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="592" y="418" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="612" y="465" font-size="26" fill="#193d35" font-weight="650">处境变化</text><text x="612" y="506" font-size="20" fill="#697770" font-weight="400">时间或需求改变</text><path d="M828 478 H845" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="856" y="418" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="876" y="465" font-size="26" fill="#193d35" font-weight="650">重新理解</text><text x="876" y="506" font-size="20" fill="#697770" font-weight="400">细节有了新含义</text><path d="M1092 478 H1109" stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1120" y="418" width="232" height="125" rx="18" fill="white" stroke="#dce2d9"/><text x="1140" y="465" font-size="26" fill="#193d35" font-weight="650">回到当下</text><text x="1140" y="506" font-size="20" fill="#697770" font-weight="400">用新的行动回应</text><rect x="64" y="598" width="1288" height="64" rx="12" fill="#eaf0e8" stroke="#eaf0e8"/><text x="88" y="639" font-size="24" fill="#245c4b" font-weight="600">分页判断：删掉这一页，会损失动作、重要信息、情绪停顿或前后呼应吗？</text></g></svg>